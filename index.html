<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民法講義總覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233b; --indigo:#2c4a76;
    --paper-outer:#f3ede0; --paper-content:#fbf8f1; --paper-card:#fffdf8;
    --seal-red:#9c2b3a; --brass:#a9832f; --border-grey:#ddd3bf; --ink-45:rgba(22,35,59,.45); --ink-70:rgba(22,35,59,.7);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper-outer);font-family:'Noto Sans TC',sans-serif;color:var(--ink);line-height:1.7;}
  h1,h2,h3,.serif{font-family:'Noto Serif TC',serif;}

  .wrap{max-width:980px;margin:0 auto;padding:0 24px 80px;}
  .hero{padding:56px 0 32px; border-bottom:1px dashed var(--border-grey); position:relative;}
  .eyebrow{font-size:12px;letter-spacing:.25em;color:var(--brass);font-weight:700;text-transform:uppercase;}
  .hero h1{font-size:34px;font-weight:900;margin:12px 0 8px;}
  .hero p{color:var(--ink-70); max-width:600px; font-size:14.5px;}

  .seal-mark{
    position:absolute; top:52px; right:0; width:70px; height:92px;
    border:2px solid var(--seal-red); border-radius:4px; color:var(--seal-red);
    display:flex; align-items:center; justify-content:center; transform:rotate(6deg);
    writing-mode:vertical-rl; font-family:'Noto Serif TC',serif; font-weight:700; font-size:17px;
    letter-spacing:.3em; opacity:.85;
  }

  .book{ margin-top:44px; }
  .book-title{
    font-size:18px; font-weight:700; padding-left:14px; border-left:4px solid var(--indigo);
    margin-bottom:4px;
  }
  .book-sub{ font-size:12.5px; color:var(--ink-45); padding-left:18px; margin-bottom:18px;}

  .chapter{ margin-bottom:28px; }
  .chapter-label{
    font-size:13px; color:var(--brass); font-weight:700; letter-spacing:.06em;
    margin-bottom:10px; padding-bottom:6px; border-bottom:1px dotted var(--border-grey);
  }

  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
  .lecture-card{
    background:var(--paper-card); border:1px solid var(--border-grey); border-radius:6px;
    padding:16px 18px; text-decoration:none; color:var(--ink); display:block;
    box-shadow:0 1px 2px rgba(22,35,59,.05);
    transition:transform .12s ease, box-shadow .12s ease;
    position:relative; overflow:hidden;
  }
  .lecture-card:hover{ transform:translateY(-2px); box-shadow:0 4px 12px rgba(22,35,59,.1); }
  .lecture-card .wm{
    position:absolute; right:-6px; bottom:-16px; font-family:'Noto Serif TC',serif; font-weight:900;
    font-size:64px; color:var(--ink); opacity:.05; line-height:1;
  }
  .lecture-card .art{ font-size:12px; color:var(--indigo); font-weight:700; margin-bottom:4px; position:relative; z-index:1;}
  .lecture-card .title{ font-size:15.5px; font-weight:700; margin-bottom:8px; position:relative; z-index:1;}
  .lecture-card .date{ font-size:12px; color:var(--ink-45); position:relative; z-index:1;}

  .empty-slot{
    border:2px dashed var(--border-grey); border-radius:6px; padding:20px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-45); font-size:13px;
    background:repeating-linear-gradient(135deg, rgba(169,131,47,.04), rgba(169,131,47,.04) 10px, rgba(169,131,47,.07) 10px, rgba(169,131,47,.07) 20px);
  }

  footer{ margin-top:50px; padding-top:20px; border-top:1px dashed var(--border-grey); font-size:12px; color:var(--ink-45); text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="seal-mark">卷宗</div>
    <div class="eyebrow">民法條文教學講義．總覽</div>
    <h1>民法講義總覽</h1>
    <p>依編章分類收錄各條文教學講義，點擊卡片進入個別講義。目前已建立「債編．債之移轉」分類，總則編架構保留供日後擴充。</p>
  </div>

  <!-- 總則編（保留，尚無講義） -->
  <div class="book">
    <div class="book-title">民法第一編．總則</div>
    <div class="book-sub">§1–152．分類架構已保留，尚未收錄講義</div>
    <div class="empty-slot">尚無總則編講義，架構已保留供日後擴充</div>
  </div>

  <!-- 債編 -->
  <div class="book">
    <div class="book-title">民法第二編．債</div>
    <div class="book-sub">依章節分類收錄</div>

    <div class="chapter">
      <div class="chapter-label">第一章 通則．第六節 債之移轉</div>
      <div class="card-grid">
        <a class="lecture-card" href="講義/民法298條-表見讓與與通知不可撤銷.html">
          <span class="wm">298</span>
          <div class="art">第298條</div>
          <div class="title">表見讓與與通知之不可撤銷效力</div>
          <div class="date">2026-08-19</div>
        </a>
      </div>
    </div>
  </div>

  <footer>civil-law-interpretation lecture series</footer>
</div>
</body>
</html>
